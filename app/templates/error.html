<!doctype html>
<html lang="{{ lang }}" data-theme="{{ theme }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ t(title) }} / Nullstar</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div style="min-height:100vh;display:grid;place-items:center;padding:28px">
  <div style="max-width:460px;width:100%">
    <a class="wordmark" href="/" style="font-size:24px">Nullstar<span class="dot">.</span></a>
    <h1 class="heavy" style="font-size:52px;font-weight:600;letter-spacing:-2px;margin:30px 0 6px;
        color:var(--rose);font-variation-settings:'opsz' 144">{{ code }}</h1>
    <p class="muted" style="font-size:16px;margin:0 0 26px;max-width:42ch">{{ message }}</p>
    <div class="row-h">
      <a class="btn btn-primary" href="/">Back to the wire</a>
      {% if not user %}<a class="btn" href="/login">Sign in</a>{% endif %}
    </div>
  </div>
</div>
</body>
</html>
