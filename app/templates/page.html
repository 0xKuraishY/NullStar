{% extends "_shell.html" %}
{% block body %}
<div class="solo">
  {% if flash %}<div class="alert alert-{{ flash.kind }}">{{ flash.message }}</div>{% endif %}
  {% if errors %}<div class="alert alert-error">
    <ul>{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul></div>{% endif %}
  {% block content %}{% endblock %}
</div>
{% endblock %}
