{% extends "page.html" %}
{% block content %}
<div class="gutter">
<div style="max-width:440px">
  {% if user.must_change_password %}
  <div class="alert alert-warn">Your password was set by an administrator. Choose your own before continuing.</div>
  {% endif %}
  <div class="panel">
    <div class="panel-head"><h2>Change password</h2></div>
    <div class="panel-body">
      <form method="post" action="/account/password">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="field">
          <label for="current_password">Current password</label>
          <input id="current_password" name="current_password" type="password" autocomplete="current-password" required autofocus>
        </div>
        <div class="field">
          <label for="password">New password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required>
          <span class="hint">At least 12 characters, mixed case, one digit.</span>
        </div>
        <div class="field">
          <label for="password_confirm">Confirm new password</label>
          <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" required>
        </div>
        <button class="btn btn-primary" type="submit">Update password</button>
        <span class="faint" style="margin-left:10px;font-size:12px">All other sessions will be signed out.</span>
      </form>
    </div>
  </div>
</div>
</div>
{% endblock %}
